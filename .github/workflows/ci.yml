name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python deps
        run: pip install dearpygui glfw pillow pyinstaller

      - name: Install Node deps
        run: npm ci

      - name: Compile check (Dear PyGui app + shared logic)
        run: |
          python -m py_compile editor/studio_imgui.py editor/particle_studio.py editor/mesh_cache.py render/gl_view.py tools/rebuild_app.py core/build_core.py

      - name: Validate extension JSON
        run: python -c "import json; d=json.load(open('AdvancedParticleEmitter.json',encoding='utf-8')); print('extension', d['version'], 'objects:', [o['name'] for o in d['eventsBasedObjects']])"

      - name: Contract check (generated files fresh, consumers in sync)
        run: |
          python tools/generate_contracts.py --check
          python tests/test_contracts.py

      - name: Build C++ core (if compiler available)
        run: python core/build_core.py

      - name: Python tests (core parity + behavior)
        run: |
          python core/test_parity.py
          python core/test_behavior.py

      - name: Python tests (headless UI + blobs)
        run: |
          python tests/test_imgui_build.py
          python tests/test_imgui_logic.py
          python tests/test_imgui_nav.py
          python tests/test_imgui_color.py
          python tests/test_imgui_mesh.py
          python tests/test_imgui_morph.py
          python tests/test_imgui_upload.py
          python tests/test_imgui_raster.py
          python tests/test_blend_modes.py
          python tests/test_seed.py
          python tests/test_preview_blobs.py

      - name: Python tests (GL + preview server, headless-tolerant)
        continue-on-error: true
        run: |
          python -m render.test_gl
          python -m render.test_clip
          python -m render.test_cost
          python tests/test_gl_blend.py
          python preview/test_server.py

      - name: Preview JS tests (engine + scenes + models + morph + bake)
        run: |
          node preview/test_engine.mjs
          node preview/test_engine3d.mjs
          node preview/test_guides.mjs
          node preview/test_models.mjs
          node preview/test_morph.mjs
          node preview/test_bake.mjs
          node preview/test_ext_bake.mjs
          node preview/test_blend.mjs
          node preview/test_seed.mjs

      - name: Runtime typecheck + loader test
        run: |
          node node_modules/typescript/bin/tsc -p carrots-runtime/tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p preview/tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p carrots-runtime/tsconfig.json
          node carrots-runtime/test_loader.mjs
