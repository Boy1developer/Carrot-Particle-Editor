<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrot Studio — Fast Preview 60 FPS</title>
<style>
  :root { --bg:#1a1b22; --panel:#22232e; --card:#262733; --accent:#7b61ff; --txt:#e8e8ee; --mut:#9a9aad; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:"Segoe UI",Arial,sans-serif; }
  header { display:flex; align-items:center; gap:10px; background:#23242f; padding:8px 14px; }
  header .logo { font-weight:800; font-size:17px; color:#ff7a00; }
  header .badge { background:var(--accent); border-radius:6px; padding:2px 10px; font-size:12px; font-weight:700; }
  header .spacer { flex:1; }
  header button, header label.btn { background:var(--card); color:#fff; border:1px solid #353646; border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
  header button:hover, header label.btn:hover { background:#343646; }
  #wrap { position:relative; height:calc(100vh - 52px);
    background:radial-gradient(120% 90% at 50% 30%, #1d2029 0%, #14161d 55%, #0e1016 100%); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #stats { position:absolute; top:12px; right:12px; background:rgba(16,17,22,.9); border:1px solid #353646; border-radius:8px; padding:8px 12px; text-align:right; font-size:13px; }
  #stats b { font-size:14px; }
  #hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(16,17,22,.9); color:var(--mut); border-radius:12px; padding:5px 16px; font-size:12px; white-space:nowrap; }
  #err { position:absolute; top:12px; left:12px; background:#3a1620; color:#ff8f8f; border:1px solid #7a2a35; border-radius:8px; padding:8px 12px; font-size:13px; display:none; max-width:40ch; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <div class="logo">🥕 Carrot Studio</div>
  <div class="badge" id="typeBadge">2d</div>
  <div class="spacer"></div>
  <span id="fname" style="color:var(--mut);font-size:13px">last_effect.json (live)</span>
  <label class="btn" for="file">📁 Open JSON</label>
  <input type="file" id="file" accept=".json,application/json">
  <button id="replay">⟳ Replay burst</button>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <canvas id="gl" style="display:none"></canvas>
  <canvas id="px" style="display:none"></canvas>
  <div id="stats">Particles: <b id="pCount">0</b><br>FPS: <b id="pFps">60</b></div>
  <div id="hint">Emitter follows mouse • live-sync with Python studio every 500ms</div>
  <div id="err"></div>
</div>
<script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "pixi.js": "../node_modules/pixi.js/dist/pixi.mjs"
    }
  }
</script>
<script id="boot-effect" type="application/json"></script>
<script type="module" src="./main.js"></script>
<script>
setTimeout(function () {
  if (!window.__previewBooted) {
    var e = document.getElementById("err");
    if (e) { e.style.display = "block"; e.textContent = "تعذر تشغيل محرك المعاينة — المتصفح لا يصل لملفات الصفحة (افحص البروكسي/جدار الحماية لـ localhost)"; }
  }
}, 10000);
</script>
</body>
</html>
